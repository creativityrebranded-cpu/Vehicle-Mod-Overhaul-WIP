; FVO traffic file: New Atlantis ring (part of the optional City Placements / Extra Vehicles addon).
; FVO re-reads this folder every 10 s. Lines starting with ; are comments. Copy this file to make your own routes:
; [world.NAME] id=  [route.NAME] ring|path  [exit.NAME]  [place.NAME]  [traffic.NAME]  (see the addon guide).
[file]
name    = New Atlantis ring
enabled = 1

[world.newatlantis]
id = JemisonPlanetWorld157133511011091040

; Two lanes round the city: lane 0 clockwise, lane 1 counter-clockwise 40 m higher.
[route.ring]
world    = newatlantis
type     = ring
centre   = -858.7 1567.4
height   = 143.5
radius   = 600
aspect   = 1.0
rotation = 0
lanes    = 2
lane_gap = 40
speed    = 25

; Exits: degrees round from north.
[exit.north]
route = ring
at = 0
[exit.east]
route = ring
at = 90
[exit.south]
route = ring
at = 180
[exit.west]
route = ring
at = 270

; Landing places (parking areas of New Atlantis).
[place.mast_pads]
world = newatlantis
point = -877 1604 -161
radius = 30
[place.east_row]
world = newatlantis
point = -713 1672 -160
radius = 30
[place.south_lot]
world = newatlantis
point = -797 1549 -161
radius = 30
[place.upper_level]
world = newatlantis
point = -762 1858 3
radius = 30

[traffic.newatlantis]
world    = newatlantis
route    = ring
max      = 3
gap      = 25
vehicles = any
trips    = mixed
reach    = 700
start_on_route = 0
